<!DOCTYPE html>
<html>
<head>
    <title>Delete Car</title>
</head>

<body>

    <h1>
        Delete Car
    </h1>

    <p>
        Are you sure you want to delete
        {{ car.brand }} {{ car.model }}?
    </p>

    <form method="POST">

        {% csrf_token %}

        <button type="submit">
            Yes, Delete
        </button>

    </form>

    <a href="{% url 'car_detail' car.id %}">
        Cancel
    </a>

</body>
</html>
