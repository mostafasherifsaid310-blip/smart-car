<!DOCTYPE html>
<html>
<head>
    <title>Delete Spare Part</title>
</head>
<body>

<h1>Delete Spare Part</h1>

<p>
    Are you sure you want to delete:
</p>

<p>
    <strong>
        {{ part.name }}
    </strong>
</p>

<form method="post">

    {% csrf_token %}

    <button type="submit">
        Yes, Delete
    </button>

</form>

<br>

<a href="{% url 'spare_part_detail' part.id %}">
    Cancel
</a>

</body>
</html>
