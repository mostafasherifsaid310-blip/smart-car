<!DOCTYPE html>
<html>
<head>
    <title>Add Spare Part</title>
</head>
<body>

<h1>Add Spare Part to Maintenance</h1>

<p>
    <strong>Car:</strong>
    {{ record.car.brand }} {{ record.car.model }}
</p>

<p>
    <strong>Service:</strong>
    {{ record.service_type }}
</p>

<hr>

<form method="post">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Add Part
    </button>

</form>

<br>

<a href="{% url 'maintenance_detail' record.id %}">
    Back
</a>

</body>
</html>
