<!DOCTYPE html>
<html>
<head>
    <title>Delete Maintenance Record</title>
</head>
<body>

<h1>Delete Maintenance Record</h1>

<p>
    Are you sure you want to delete this maintenance record?
</p>

<p>
    <strong>Car:</strong>
    {{ record.car.brand }} {{ record.car.model }}
</p>

<p>
    <strong>Service:</strong>
    {{ record.service_type }}
</p>

<form method="post">

    {% csrf_token %}

    <button type="submit">
        Yes, Delete
    </button>

</form>

<br>

<a href="{% url 'maintenance_detail' record.id %}">
    Cancel
</a>

</body>
</html>
